<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merc — Video Editor</title>
<style>
:root{--bg:#0e1a3a;--bg2:#13234d;--card:#182b5c;--line:#2a417e;--text:#eaf0ff;--mut:#9fb3e6;--a:#4f8cff;--a2:#7fb2ff;--a3:#2fd3ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 700px at 50% -10%,#1d3a82 0%,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 14s ease-in-out infinite}
.o1{width:420px;height:420px;background:var(--a);top:8%;left:-6%}
.o2{width:360px;height:360px;background:var(--a3);top:50%;right:-8%;animation-delay:-5s}
.o3{width:300px;height:300px;background:#6a7bff;bottom:-5%;left:35%;animation-delay:-9s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.1)}}
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:4px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(19,35,77,.7);backdrop-filter:blur(14px);transition:padding .35s cubic-bezier(.2,.8,.2,1),gap .35s,box-shadow .35s,background .35s;animation:drop .8s cubic-bezier(.2,.8,.2,1) backwards}
nav:hover{padding:10px 12px;gap:10px;background:rgba(19,35,77,.92);box-shadow:0 14px 50px rgba(79,140,255,.35)}
nav:hover a{padding:11px 22px;font-size:1.02rem}
@keyframes drop{from{opacity:0;transform:translate(-50%,-30px)}}
nav a{color:var(--mut);text-decoration:none;font-size:.9rem;padding:8px 16px;border-radius:999px;transition:.25s}
nav a:hover,nav a.on{color:#fff;background:rgba(79,140,255,.28)}
nav .cta{background:var(--a);color:#fff;font-weight:600}
nav .cta:hover{background:var(--a2)}
section{max-width:1100px;margin:0 auto;padding:110px 22px 40px}
#home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.pill{border:1px solid var(--line);background:rgba(24,43,92,.6);padding:6px 16px;border-radius:999px;font-size:.85rem;color:var(--a2);margin-bottom:22px}
h1{font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.08;letter-spacing:-.02em;max-width:900px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.sub{color:var(--mut);margin:20px 0 32px;max-width:560px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;text-decoration:none;font-weight:600;transition:.25s;border:1px solid var(--line);color:var(--text)}
.btn.p{background:linear-gradient(135deg,var(--a),#3a6be0);border-color:transparent;box-shadow:0 8px 30px rgba(79,140,255,.4)}
.btn:hover{transform:translateY(-3px)}
h2{font-size:clamp(1.7rem,4vw,2.6rem);text-align:center;margin-bottom:36px;letter-spacing:-.01em}
.marq{overflow:hidden;padding:36px 0;margin:-36px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:18px;width:max-content;animation:scroll 28s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.client{min-width:230px;display:flex;align-items:center;gap:14px;padding:16px 20px;border:1px solid var(--line);border-radius:18px;background:var(--card);position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s,background .35s}
.client:hover{transform:scale(1.14);z-index:2;border-color:var(--a);background:#1d3470;box-shadow:0 16px 40px rgba(79,140,255,.4)}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.3rem;background:linear-gradient(135deg,var(--a),var(--a3))}
.client b{display:block}.client span{color:var(--mut);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:50px}
.stat{text-align:center;padding:26px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.stat b{display:block;font-size:2.4rem;color:var(--a2)}.stat span{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.vid{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card);transition:.3s}
.vid:hover{transform:translateY(-8px);border-color:var(--a);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#1f3d8a,#0f2250)}
.play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);display:grid;place-items:center;transition:.3s}
.vid:hover .play{transform:scale(1.15);background:var(--a)}
.play:after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.meta{padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.meta span{color:var(--mut);font-size:.9rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.tcard{padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--card);position:relative;overflow:hidden}
.tcard:hover{transform:translateY(-8px);border-color:var(--a);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.tcard:before{content:"“";position:absolute;top:6px;right:22px;font-size:5rem;line-height:1;color:var(--a);opacity:.35}
.stars{color:#ffd166;letter-spacing:3px;margin-bottom:12px}
.tcard p{margin-bottom:20px}
.who{display:flex;align-items:center;gap:12px}
.who .av{width:44px;height:44px;font-size:1rem}
.who span{color:var(--mut);font-size:.85rem;display:block}
.contact{text-align:center}
.links{display:flex;flex-direction:column;gap:12px;max-width:380px;margin:0 auto}
footer{text-align:center;color:var(--mut);padding:50px 20px 30px;font-size:.9rem}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:560px){nav a{padding:8px 10px;font-size:.8rem}nav .cta{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<nav id="nav"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script>
/* =====================================================
   EDIT YOUR CONTENT HERE — everything on the page comes from this block
   ===================================================== */
var SITE = {
  name: "Merc",
  badge: "Video Editor · 3 Years Experience",
  headlineStart: "Don’t Settle for “Average” When You Can Create ",
  headlineAccent: "BANGERS!",
  subtext: "I’m Merc, your personal editing machine, here to bring your ideas to life.",
  mainLink: "https://x.com/ErosiaVfx",          // your X / main contact link
  ctaText: "Work with Merc",

  clientsTitle: "I’ve Worked With",
  clients: [                                      // letter = avatar letter
    { name: "Layla",  subs: "15M Subs",  letter: "L" },
    { name: "Myla",   subs: "100K Subs", letter: "M" },
    { name: "AquaTV", subs: "66K Subs",  letter: "A" }
  ],

  stats: [                                        // value animates from random digits
    { value: "40K+", label: "Views on top edits" },
    { value: "3+",   label: "Years editing" },
    { value: "3",    label: "Channels served" }
  ],

  workTitle: "My Work",
  videos: [                                       // paste YouTube links
    { title: "Featured Edit", views: "40K+ views", url: "https://www.youtube.com/watch?v=yAahokWiTs8" },
    { title: "Layla",         views: "41K+ views", url: "https://www.youtube.com/watch?v=Ab8DooQW-AE" },
    { title: "Myla",          views: "12K+ views", url: "https://www.youtube.com/watch?v=pfm14xvmUN0" },
    { title: "Featured Edit", views: "40K+ views", url: "https://www.youtube.com/watch?v=SNNJnl60nB4" },
    { title: "AquaTV",        views: "6K+ views",  url: "https://www.youtube.com/watch?v=ukIwczkWTPY" }
  ],

  reviewsTitle: "What Clients Say",
  reviews: [                                      // replace placeholders with real quotes
    { quote: "Placeholder: replace this with a real testimonial from one of your clients.", name: "Client Name", channel: "Channel · 000K Subs" },
    { quote: "Placeholder: replace this with a real testimonial from one of your clients.", name: "Client Name", channel: "Channel · 000K Subs" },
    { quote: "Placeholder: replace this with a real testimonial from one of your clients.", name: "Client Name", channel: "Channel · 000K Subs" }
  ],

  contactTitle: "Let’s Work Together",
  contactLinks: [
    { text: "DM Merc (X)",       url: "https://x.com/ErosiaVfx",                          primary: true },
    { text: "DM Merc (Discord)", url: "https://discord.com/users/746562938147700766" },
    { text: "Email Merc",        url: "mailto:you@example.com" }   // put your real email
  ],
  footerText: "© 2026 Merc. All rights reserved."
};
/* ===================== END OF CONTENT ===================== */

var S = SITE, h = [];
document.title = S.name + " — Video Editor";
document.getElementById("nav").innerHTML =
  ["Home:home","Clients:clients","Work:work","Reviews:reviews","Contact:contact"].map(function(x){var p=x.split(":");return '<a href="#'+p[1]+'"'+(p[1]==="home"?' class="on"':'')+'>'+p[0]+'</a>'}).join("") +
  '<a href="'+S.mainLink+'" class="cta">'+S.ctaText+'</a>';

var cl = S.clients.map(function(c){return '<div class="client"><div class="av">'+c.letter+'</div><div><b>'+c.name+'</b><span>'+c.subs+'</span></div></div>'}).join("");
h.push('<section id="home"><div class="pill">'+S.badge+'</div><h1>'+S.headlineStart+'<em>'+S.headlineAccent+'</em></h1><p class="sub">'+S.subtext+'</p><div class="btns"><a class="btn p" href="'+S.mainLink+'">'+S.ctaText+' →</a><a class="btn" href="#work">See my work ↓</a></div></section>');
h.push('<section id="clients"><h2 class="rv">'+S.clientsTitle+'</h2><div class="marq rv"><div class="track">'+cl+cl+cl+cl+'</div></div><div class="stats">'+S.stats.map(function(s){return '<div class="stat rv"><b data-t="'+s.value+'">0</b><span>'+s.label+'</span></div>'}).join("")+'</div></section>');
h.push('<section id="work"><h2 class="rv">'+S.workTitle+'</h2><div class="grid">'+S.videos.map(function(v){return '<a class="vid rv" href="'+v.url+'"><div class="thumb"><div class="play"></div></div><div class="meta"><b>'+v.title+'</b><span>'+v.views+'</span></div></a>'}).join("")+'</div></section>');
h.push('<section id="reviews"><h2 class="rv">'+S.reviewsTitle+'</h2><div class="tgrid">'+S.reviews.map(function(r){return '<div class="tcard rv"><div class="stars">★★★★★</div><p>'+r.quote+'</p><div class="who"><div class="av">'+r.name.charAt(0)+'</div><div><b>'+r.name+'</b><span>'+r.channel+'</span></div></div></div>'}).join("")+'</div></section>');
h.push('<section id="contact" class="contact"><h2 class="rv">'+S.contactTitle+'</h2><div class="links rv">'+S.contactLinks.map(function(l){return '<a class="btn'+(l.primary?' p':'')+'" href="'+l.url+'">'+l.text+'</a>'}).join("")+'</div></section>');
document.getElementById("app").innerHTML = h.join("");
document.getElementById("foot").textContent = S.footerText;

function scramble(n){var t=n.dataset.t,f=0,total=32;var id=setInterval(function(){f++;var out='';for(var k=0;k<t.length;k++){var c=t[k],lock=Math.floor(total*(.45+.55*(k+1)/t.length));out+=(/\d/.test(c)&&f<lock)?Math.floor(Math.random()*10):c}n.textContent=out;if(f>=total){n.textContent=t;clearInterval(id)}},50)}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');
var n=e.target.querySelector('[data-t]');if(n&&!n.d){n.d=1;scramble(n)}}})},{threshold:.15});
document.querySelectorAll('.rv').forEach(function(el,i){el.style.transitionDelay=(i%4)*90+'ms';io.observe(el)});
var links=document.querySelectorAll('nav a[href^="#"]');
var so=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id)})}})},{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section').forEach(function(s){so.observe(s)});
</script>
</body>
</html>
